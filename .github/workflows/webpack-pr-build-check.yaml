name: Webpack Build Check (Node.js)
description: 'This workflow triggers a Node.js build on a Pull Request to main to check the workflow: it reads the Node version from Build/.nvmrc, checks out the code, installs dependencies via npm ci (without install scripts), and runs the production Webpack build.'

on:
  pull_request:
    branches: [ "main", "7.x" ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: 'Build/.nvmrc'

      # Install scripts are skipped because the Webpack build does not need
      # them. The only relevant one belongs to "canvas", which is used for the
      # Jest tests: it downloads a prebuilt binary and otherwise tries to
      # compile it, which fails on the runner whenever the download fails.
      - name: Install Dependencies from package-lock.json
        working-directory: Build
        run: npm ci --ignore-scripts

      - name: Run Webpack Build for Production (Check Only)
        working-directory: Build
        run: npm run build
